<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Desmos graphing calculator</title>
  <style>
    html, body, #calculator {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #fff;
    }
  </style>
</head>
<body>
  <div id="calculator"></div>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var apiKey = params.get('apiKey') || 'dcb31709b452b1cf9dc26972add0fda6';
      var script = document.createElement('script');
      script.src = 'https://www.desmos.com/api/v1.13/calculator.js?apiKey=' +
        encodeURIComponent(apiKey);
      script.onload = function () {
        var elt = document.getElementById('calculator');
        window.calculator = Desmos.GraphingCalculator(elt, {
          keypad: true,
          expressions: true,
          settingsMenu: true,
          zoomButtons: true,
          border: false,
          autosize: true
        });
      };
      document.head.appendChild(script);
    })();
  </script>
</body>
</html>
