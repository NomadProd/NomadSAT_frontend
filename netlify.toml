[build]
  command = """
    set -e
    FLUTTER_HOME="${NETLIFY_BUILD_BASE:-/opt/buildhome}/cache/flutter"
    if [ ! -x "$FLUTTER_HOME/bin/flutter" ]; then
      rm -rf "$FLUTTER_HOME"
      git clone --depth 1 --branch stable https://github.com/flutter/flutter.git "$FLUTTER_HOME"
    fi
    export PATH="$FLUTTER_HOME/bin:$PATH"
    flutter --version
    flutter config --enable-web
    flutter pub get
    flutter build web --release --no-tree-shake-icons --dart-define=API_BASE_URL=https://api.turansat.com
  """
  publish = "build/web"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; img-src 'self' data: blob: https://res.cloudinary.com https://*.cloudinary.com; font-src 'self' data: https://fonts.gstatic.com; style-src 'self' 'unsafe-inline'; script-src 'self' 'wasm-unsafe-eval' https://www.gstatic.com https://static.cloudflareinsights.com; worker-src 'self' blob:; connect-src 'self' https://api.turansat.com https://www.gstatic.com https://fonts.gstatic.com https://cloudflareinsights.com https://res.cloudinary.com https://*.cloudinary.com"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/canvaskit/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/flutter_bootstrap.js"
  [headers.values]
    Cache-Control = "no-cache"
